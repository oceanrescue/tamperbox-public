name: Feature or new tool request
description: Suggest a new capability, tool, or improvement.
title: '[Feature]: '
labels:
  - enhancement
  - status:triage
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues before submitting. This tracker is public: remove credentials,
        personal data, and confidential content from examples and screenshots.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Website or tool
        - API
        - MCP integration
        - Documentation
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Describe the outcome you would like and who it would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
      description: How do you handle this today?
  - type: textarea
    id: examples
    attributes:
      label: Examples or context
      description: Optional examples, related issues, or references.
