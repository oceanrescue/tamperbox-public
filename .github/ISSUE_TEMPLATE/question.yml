name: Question
description: Ask about using Tamperbox.
title: '[Question]: '
labels:
  - question
  - status:triage
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues before submitting. This tracker is public: remove credentials,
        personal data, and confidential content from examples and screenshots.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Website or tool
        - API
        - MCP integration
        - Documentation
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to accomplish, and where are you stuck?
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
      description: Include relevant documentation links or sanitized examples.
